<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3d;
        --text: #e2e8f0;
        --muted: #6b7280;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --danger: #ef4444;
        --success: #22c55e;
        --high: #ef4444;
        --medium: #f59e0b;
        --low: #22c55e;
        --radius: 10px;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        min-height: 100vh;
      }

      #auth-screen,
      #app-screen {
        max-width: 480px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      #app-screen {
        max-width: 680px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        color: var(--accent);
        text-align: center;
        letter-spacing: -0.5px;
      }
      h2 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 1rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 1rem;
      }

      .tabs {
        display: flex;
        gap: 0.25rem;
        margin-bottom: 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.25rem;
      }
      .tab {
        flex: 1;
        padding: 0.5rem;
        border: none;
        background: transparent;
        color: var(--muted);
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.15s;
      }
      .tab.active {
        background: var(--accent);
        color: #fff;
      }

      .input-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input,
      select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.55rem 0.75rem;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus,
      select:focus {
        border-color: var(--accent);
      }
      input[type='text'] {
        flex: 1;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        color: var(--text);
        border-color: var(--text);
      }
      .btn-danger {
        background: transparent;
        color: var(--danger);
        border: 1px solid transparent;
        padding: 0.3rem 0.5rem;
      }
      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.1);
      }

      .todo-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .todo-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        transition: border-color 0.15s;
      }
      .todo-item:hover {
        border-color: var(--accent);
      }
      .todo-item.done .todo-title {
        text-decoration: line-through;
        color: var(--muted);
      }

      .check {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .check.done {
        background: var(--success);
        border-color: var(--success);
      }
      .check.done::after {
        content: '✓';
        font-size: 11px;
        color: #fff;
        font-weight: 700;
      }

      .todo-title {
        flex: 1;
        font-size: 0.925rem;
      }
      .todo-title[contenteditable='true'] {
        outline: 1px solid var(--accent);
        border-radius: 4px;
        padding: 0 4px;
      }

      .badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.2rem 0.45rem;
        border-radius: 99px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .badge-high {
        background: rgba(239, 68, 68, 0.15);
        color: var(--high);
      }
      .badge-medium {
        background: rgba(245, 158, 11, 0.15);
        color: var(--medium);
      }
      .badge-low {
        background: rgba(34, 197, 94, 0.15);
        color: var(--low);
      }

      .due {
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .due.overdue {
        color: var(--danger);
      }

      .stats-bar {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.825rem;
        color: var(--muted);
      }
      .stats-bar span b {
        color: var(--text);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }

      .err {
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: 0.4rem;
        min-height: 1.1em;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
        margin-right: 4px;
      }
      .dot.off {
        background: var(--danger);
      }

      .pagination {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        justify-content: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .pagination button {
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
      }

      .search-row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .search-row input {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <!-- Auth Screen -->
    <div id="auth-screen">
      <h1>✓ Todo App</h1>
      <div class="card">
        <div class="tabs">
          <button class="tab active" id="tab-login" onclick="showTab('login')">Login</button>
          <button class="tab" id="tab-register" onclick="showTab('register')">Register</button>
        </div>
        <div id="auth-form">
          <input
            type="text"
            id="auth-username"
            placeholder="Username"
            style="width: 100%; margin-bottom: 0.5rem"
          />
          <input
            type="password"
            id="auth-password"
            placeholder="Password"
            style="width: 100%; margin-bottom: 0.5rem"
          />
          <button class="btn-primary" style="width: 100%" onclick="submitAuth()">Login</button>
          <p class="err" id="auth-err"></p>
        </div>
      </div>
    </div>

    <!-- App Screen -->
    <div id="app-screen" style="display: none">
      <div class="topbar">
        <h1 style="margin: 0">✓ Todos</h1>
        <div style="display: flex; align-items: center; gap: 0.75rem">
          <span style="font-size: 0.8rem; color: var(--muted)"
            ><span class="dot" id="ws-dot"></span><span id="ws-label">connecting</span></span
          >
          <button class="btn-ghost" onclick="logout()">Logout</button>
        </div>
      </div>

      <div id="stats-bar" class="stats-bar"></div>

      <div class="card">
        <div class="input-row">
          <input
            type="text"
            id="new-title"
            placeholder="New todo…"
            onkeydown="if (event.key === 'Enter') addTodo();"
          />
          <select id="new-priority">
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
          <input type="date" id="new-due" style="width: 140px" />
          <button class="btn-primary" onclick="addTodo()">Add</button>
        </div>
        <p class="err" id="add-err"></p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="setFilter('all', this)">All</button>
        <button class="tab" onclick="setFilter('pending', this)">Pending</button>
        <button class="tab" onclick="setFilter('done', this)">Done</button>
      </div>

      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search…" oninput="debounceSearch()" />
      </div>

      <ul class="todo-list" id="todo-list"></ul>

      <div class="pagination" id="pagination"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let TOKEN = localStorage.getItem('todo_token') || '';
      let mode = 'login';
      let filter = 'all';
      let page = 1;
      let searchTerm = '';
      let searchTimer = null;
      let socket = null;

      // ── Auth ──────────────────────────────────────────────────
      function showTab(t) {
        mode = t;
        document.getElementById('tab-login').classList.toggle('active', t === 'login');
        document.getElementById('tab-register').classList.toggle('active', t === 'register');
        document.querySelector('#auth-form button').textContent =
          t === 'login' ? 'Login' : 'Register';
        document.getElementById('auth-err').textContent = '';
      }

      async function submitAuth() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value;
        const ep = mode === 'login' ? '/auth/login' : '/auth/register';
        const r = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const d = await r.json();
        if (!r.ok) {
          document.getElementById('auth-err').textContent = d.error;
          return;
        }
        TOKEN = d.token;
        localStorage.setItem('todo_token', TOKEN);
        showApp();
      }

      function logout() {
        localStorage.removeItem('todo_token');
        TOKEN = '';
        if (socket) socket.disconnect();
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('auth-screen').style.display = '';
      }

      // ── Boot ─────────────────────────────────────────────────
      window.onload = () => {
        if (TOKEN) showApp();
      };

      function showApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = '';
        connectSocket();
        loadTodos();
        loadStats();
      }

      // ── WebSocket ─────────────────────────────────────────────
      function connectSocket() {
        socket = io({ auth: { token: TOKEN } });
        const dot = document.getElementById('ws-dot');
        const lbl = document.getElementById('ws-label');
        socket.on('connect', () => {
          dot.className = 'dot';
          lbl.textContent = 'live';
        });
        socket.on('disconnect', () => {
          dot.className = 'dot off';
          lbl.textContent = 'offline';
        });
        socket.on('todos:update', () => {
          loadTodos();
          loadStats();
        });
      }

      // ── API helpers ───────────────────────────────────────────
      const api = (path, opts = {}) =>
        fetch(path, {
          ...opts,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${TOKEN}`,
            ...opts.headers,
          },
        });

      // ── Todos ─────────────────────────────────────────────────
      async function loadTodos() {
        const doneQ = filter === 'all' ? '' : `&done=${filter === 'done'}`;
        const searchQ = searchTerm ? `&search=${encodeURIComponent(searchTerm)}` : '';
        const r = await api(`/todos?page=${page}&limit=10${doneQ}${searchQ}`);
        if (r.status === 401) {
          logout();
          return;
        }
        const d = await r.json();
        renderList(d.data || []);
        renderPagination(d);
      }

      async function loadStats() {
        const r = await api('/stats');
        if (!r.ok) return;
        const s = await r.json();
        document.getElementById('stats-bar').innerHTML =
          `<span><b>${s.total}</b> total</span><span><b>${s.done}</b> done</span><span><b>${s.pending}</b> pending</span>${s.overdue ? `<span style="color:var(--danger)"><b>${s.overdue}</b> overdue</span>` : ''}<span>H:<b>${s.byPriority.high}</b> M:<b>${s.byPriority.medium}</b> L:<b>${s.byPriority.low}</b></span>`;
      }

      function renderList(todos) {
        const ul = document.getElementById('todo-list');
        ul.innerHTML = '';
        if (!todos.length) {
          ul.innerHTML =
            '<li style="color:var(--muted);text-align:center;padding:2rem">No todos here.</li>';
          return;
        }
        todos.forEach((t) => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (t.done ? ' done' : '');
          const overdue = t.dueDate && !t.done && new Date(t.dueDate) < new Date();
          li.innerHTML = `
        <div class="check ${t.done ? 'done' : ''}" onclick="toggle(${t.id})"></div>
        <span class="todo-title" contenteditable="false" onblur="saveTitle(${t.id},this)">${esc(t.title)}</span>
        <span class="badge badge-${t.priority}">${t.priority}</span>
        ${t.dueDate ? `<span class="due ${overdue ? 'overdue' : ''}">${t.dueDate}</span>` : ''}
        <button class="btn-ghost" style="padding:.3rem .5rem;font-size:.75rem" onclick="startEdit(this)">✎</button>
        <button class="btn-danger" onclick="del(${t.id})">✕</button>`;
          ul.appendChild(li);
        });
      }

      function renderPagination({ page: p, pages, total }) {
        const el = document.getElementById('pagination');
        if (pages <= 1) {
          el.innerHTML = '';
          return;
        }
        el.innerHTML = `
      <button class="btn-ghost" onclick="goPage(${p - 1})" ${p <= 1 ? 'disabled' : ''}>‹</button>
      <span>Page ${p} / ${pages} &nbsp;(${total} items)</span>
      <button class="btn-ghost" onclick="goPage(${p + 1})" ${p >= pages ? 'disabled' : ''}>›</button>`;
      }

      function goPage(n) {
        page = n;
        loadTodos();
      }

      async function addTodo() {
        const title = document.getElementById('new-title').value.trim();
        const priority = document.getElementById('new-priority').value;
        const dueDate = document.getElementById('new-due').value || null;
        const err = document.getElementById('add-err');
        err.textContent = '';
        if (!title) {
          err.textContent = 'Title is required';
          return;
        }
        const r = await api('/todos', {
          method: 'POST',
          body: JSON.stringify({ title, priority, dueDate }),
        });
        const d = await r.json();
        if (!r.ok) {
          err.textContent = d.error;
          return;
        }
        document.getElementById('new-title').value = '';
        document.getElementById('new-due').value = '';
        loadTodos();
        loadStats();
      }

      async function toggle(id) {
        await api(`/todos/${id}/toggle`, { method: 'PATCH' });
        loadTodos();
        loadStats();
      }

      async function del(id) {
        await api(`/todos/${id}`, { method: 'DELETE' });
        loadTodos();
        loadStats();
      }

      function startEdit(btn) {
        const span = btn.closest('.todo-item').querySelector('.todo-title');
        span.contentEditable = 'true';
        span.focus();
        const range = document.createRange();
        range.selectNodeContents(span);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        btn.style.display = 'none';
      }

      async function saveTitle(id, span) {
        span.contentEditable = 'false';
        const newTitle = span.textContent.trim();
        if (!newTitle) {
          loadTodos();
          return;
        }
        const item = span.closest('.todo-item');
        const priority = item.querySelector('.badge').textContent.trim();
        const dueEl = item.querySelector('.due');
        const dueDate = dueEl ? dueEl.textContent.trim() : null;
        const done = item.classList.contains('done');
        await api(`/todos/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ title: newTitle, done, priority, dueDate }),
        });
        loadTodos();
        loadStats();
      }

      function setFilter(f, el) {
        filter = f;
        page = 1;
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        el.classList.add('active');
        loadTodos();
      }

      function debounceSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          searchTerm = document.getElementById('search-input').value.trim();
          page = 1;
          loadTodos();
        }, 300);
      }

      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    </script>
  </body>
</html>
