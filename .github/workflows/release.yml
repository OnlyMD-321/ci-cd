name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test-usecase:
    name: Use-case tests
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run use-case tests
        run: npm test -- --testPathPattern="health|todos|usecase"

  test-failure:
    name: Failure tests
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run failure tests
        run: npm test -- --testPathPattern="failure"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-usecase, test-failure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Coverage (full suite)
        run: npm test -- --coverage --coverageReporters=text-summary
      - run: npm run build

  promote:
    name: Promote dev → main
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fast-forward main to dev
        run: |
          git fetch origin main dev
          git checkout -B main origin/main
          git merge --ff-only origin/dev
          git push origin main
